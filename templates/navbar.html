<div class="navbar">
    <div class="left-navbar navbar-section">
        <a class="navbar-item" href="/">
            Problems
        </a>
        <form
        class="nav-bar-search-form"
        action="/process_problem_search"
        method="POST"
        >
        <input
            class="nav-bar-search"
            name="searchs"
            id="searchs"
            placeholder="search problems"
        />
        </form>
    </div>

    <div class="right-navbar navbar-section">
        {% if current_user.is_authenticated %}
        <div>
            {{current_user.name}}
        </div>
        {% if current_user.role == 'admin' %}
        <a class="navbar-item" href="/add_problem">
            Add Problem
        </a>
        {% endif %}
        <form action="/logout">
            <button class="navbar-item" type="submit">logout</button>
        </form>
        {% else %}
        <a class="navbar-item" href="/login">
            Login
        </a>
        {% endif %}
    </div>

</div>
