{% extends "layout.html" %}
{% block content %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Problem</title>
</head>
<body>
    <div class="add-problem-main">
        <h1 class="add-problem-header">Add New Problem</h1>
        <form class="add-problem-form" id="problem-form" method="post">
            <div class="add-problem-form-inputs">
                <div class="add-problem-info-section add-problem-section">
                    <div>
                        <label for="problem_name">Problem Name:</label>
                        <input class="add-problem-filter-input" type="text" id="problem_name" name="problem_name" required>
                    </div>
                    <hr class="problem-list-row-gap">
                    <div>
                        <label for="description">Description:</label>
                        <textarea class="add-problem-filter-input" class="description" id="description" name="description" required></textarea>
                    </div>
                    <hr class="problem-list-row-gap">
                    <div>
                        <label for="type">Type:</label>
                        <input class="add-problem-filter-input" type="text" id="type" name="type" required>
                    </div>
                    <hr class="problem-list-row-gap">
                    <div>
                        <label for="difficulty">Difficulty:</label>
                        <select class="form-control" id="difficulty" name="difficulty">
                            <option value="Easy">Easy</option>
                            <option value="Medium">Medium</option>
                            <option value="Hard">Hard</option>
                        </select>
                    </div>
                    <hr class="problem-list-row-gap">
                    <div>
                        <label for="default_code">Default Code:</label>
                        <input class="add-problem-filter-input" type="text" id="default_code" name="default_code" value="def function_name(args): pass">
                    </div>
                </div>
                <div class="add-problem-testcase-section add-problem-section" id="testcases-section">
                    <h3>Test Cases</h3>
                    <button class="problem-list-filter-button" type="button" onclick="addTestCase()">Add Test Case</button>
                    <hr class="problem-list-row-gap">
                    <div id="testcases-container"></div>
                </div>
            </div>
            <button class="problem-list-filter-button add-problem-button" type="submit">Add Problem</button>
        </form>
    </div>
<script>
    let testCaseCount = 0;

    document.body.style.height = 'auto';
    document.body.style.minHeight = '100vh';
    
    function addTestCase() {
        testCaseCount++;
        const container = document.getElementById('testcases-container');
        const testCaseDiv = document.createElement('div');
        testCaseDiv.className = 'testcase-input';
        testCaseDiv.innerHTML = `
            <div class='add-testcase'>
                <h4>Test Case ${testCaseCount}</h4>
                    <label>Input (JSON format, e.g., {"arg1": "value1", "arg2": 2}):</label>
                    <textarea class="add-problem-filter-input" name="test_input_${testCaseCount}" required></textarea>
                <div>
                    <label>Expected Output:</label>
                    <input class="add-problem-filter-input" type="text" name="expected_output_${testCaseCount}" required>
                </div>
                <div>
                    <label>Type:</label>
                    <select class="form-control" name="test_type_${testCaseCount}">
                        <option value="public">Public</option>
                        <option value="private">Private</option>
                    </select>
                </div>
                <button class="problem-list-filter-button" type="button" onclick="removeTestCase(this)">Remove</button>
                <hr class="problem-list-row-gap">
            </div>
        `;

        container.appendChild(testCaseDiv);
    }

    function removeTestCase(button) {
        button.parentElement.remove();
        testCaseCount--;
    }
</script>
</body>
</html>
{% endblock %}
