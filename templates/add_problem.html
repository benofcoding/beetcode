{% extends "layout.html" %}
{% block content %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Problem</title>
</head>
<body>
    <div class="main-container">
        <div class="problem-description">
            <h1>Add New Problem</h1>
            <form id="problem-form" method="post">
                <div>
                    <label for="problem_name">Problem Name:</label>
                    <input type="text" id="problem_name" name="problem_name" required>
                </div>
                <div>
                    <label for="description">Description:</label>
                    <textarea id="description" name="description" required></textarea>
                </div>
                <div>
                    <label for="type">Type:</label>
                    <input type="text" id="type" name="type" required>
                </div>
                <div>
                    <label for="difficulty">Difficulty:</label>
                    <select id="difficulty" name="difficulty">
                        <option value="Easy">Easy</option>
                        <option value="Medium">Medium</option>
                        <option value="Hard">Hard</option>
                    </select>
                </div>
                <div>
                    <label for="default_code">Default Code:</label>
                    <input type="text" id="default_code" name="default_code" value="def function_name(args): pass">
                </div>
                <div id="testcases-section">
                    <h3>Test Cases</h3>
                    <button type="button" onclick="addTestCase()">Add Test Case</button>
                    <div id="testcases-container"></div>
                </div>
                <button type="submit">Add Problem</button>
            </form>
        </div>
    </div>
<script>
    let testCaseCount = 0;

    document.body.style.height = 'auto';
    
    function addTestCase() {
        testCaseCount++;
        const container = document.getElementById('testcases-container');
        const testCaseDiv = document.createElement('div');
        testCaseDiv.className = 'testcase-input';
        testCaseDiv.innerHTML = `
            <h4>Test Case ${testCaseCount}</h4>
            <div>
                <label>Input (JSON format, e.g., {"arg1": "value1", "arg2": 2}):</label>
                <textarea name="test_input_${testCaseCount}" required></textarea>
            </div>
            <div>
                <label>Expected Output:</label>
                <input type="text" name="expected_output_${testCaseCount}" required>
            </div>
            <div>
                <label>Type:</label>
                <select name="test_type_${testCaseCount}">
                    <option value="public">Public</option>
                    <option value="private">Private</option>
                </select>
            </div>
            <button type="button" onclick="removeTestCase(this)">Remove</button>
        `;
        container.appendChild(testCaseDiv);
    }

    function removeTestCase(button) {
        button.parentElement.remove();
        testCaseCount--;
    }
</script>
</body>
</html>
{% endblock %}
